[project]
name = "ugc-studio"
version = "0.1.0"
description = "Garment-faithful AI UGC video pipeline for Shopee / TikTok Shop"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "fal-client",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "httpx",
  "opencv-python-headless",
  "numpy",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ugc", "ugc.qa", "ugc.providers", "app"]

[tool.setuptools.package-data]
app = ["static/*"]
